name: kessler
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kessler
      POSTGRES_PASSWORD: kessler
      POSTGRES_DB: kessler
    ports:
      - "5432:5432"
    volumes:
      - kessler-db:/var/lib/postgresql/data
volumes:
  kessler-db:
    name: kessler-db
