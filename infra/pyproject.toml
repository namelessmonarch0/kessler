[project]
name = "infra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.270.0",
    "constructs>=10.8,<11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
